# Builds the website in site/ and publishes it with GitHub Pages.
# One-time setup in the repository: Settings, Pages, Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/install-guide.md'
      - 'docs/release-notes-beta-*.md'
      - 'docs/images/**'
      # The workshop (site/workshop.mjs) is the app's own Styles page and style editor, with core underneath.
      - 'packages/core/src/**'
      - 'apps/desktop/src/renderer/**'
      - 'apps/desktop/src/shared/**'
      - 'package-lock.json'
      # The site shows the app's theme paintings and icon (site/build.mjs copies them in).
      - 'apps/desktop/src/renderer/src/assets/backdrops/**'
      - 'apps/desktop/src/renderer/src/assets/hiltwright-icon.svg'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            package-lock.json
      # The workshop bundles React, pixi.js and the app's typefaces from the repo's own install, the versions the app
      # ships. Only plain JavaScript is needed from it, so no install scripts run (Electron is not downloaded).
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
